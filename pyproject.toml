[project]
description = "Image Registration"
name = "register"
requires-python = ">=3.13"
version = "0.0.1"
# readme = "README.md"

[project.scripts]
register-image = "register.cli:app"

[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "numba>=0.65.1",
    "numpy>=2.4.2",
    "setuptools >= 82.0.0",
    "wheel",
]

[project.optional-dependencies]
cli = [
    "typer-slim>=0.24.0",
]
dev = [
    "ipdb",
    "mypy >= 1.21.0",
    "pytest",
    "ruff",
]
opencv = [
    "opencv-contrib-python-headless",
]

[tool.setuptools.packages.find]
exclude = ["tests"]

[tool.pytest.ini_options]
addopts = "-s"
minversion = "6.0"
testpaths = ["tests"]

[tool.mypy]
allow_any_generics = false
allow_untyped_defs = false
check_untyped_defs = true
extra_checks = true
ignore_missing_imports = true
no_implicit_optional = true
python_version = "3.13"
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true

[tool.ruff]
indent-width = 4
line-length = 120
preview = true
target-version = "py314"

[tool.ruff.lint]
ignore = ["B028", "B905", "C408", "E203", "SIM102", "SIM108"]
preview = true
select = ["B", "C4", "E", "F", "FURB", "I", "PT", "Q", "SIM", "U", "YTT"]
