[project]
name = "register"
description = "Image Registration"
version = "0.0.1"
requires-python = ">=3.11"
# readme = "README.md"

[build-system]
requires = [
    "setuptools >= 65.5.1",
    "wheel",
    "pybind11>=2.9.2",
    "numpy",
]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "ipdb",
    "isort",
    "mypy >= 1.7",
    "pytest",
]
opencv = [
    "opencv-python",
]

[tool.setuptools.packages.find]
exclude = ["tests"]

[tool.black]
line-length = 120
target_version = ["py311"]
preview = true
