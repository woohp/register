[project]
dependencies = [
    "numba >= 0.68.0",
    "numpy >= 2.5.4",
    "opencv-contrib-python-headless >= 5.0.0.93",
]
description = "Image Registration"
name = "register"
readme = "README.md"
requires-python = ">=3.14"
version = "0.0.1"

[project.scripts]
register-image = "register.cli:app"

[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools >= 84.0.0",
]

[project.optional-dependencies]
cli = [
    "typer >= 0.27.3",
]
dev = [
    "ipdb",
    "mypy >= 2.4.0",
    "pillow >= 12.3.0",
    "pytest",
    "ruff >= 0.17.0",
]

[tool.setuptools.package-data]
"register" = ["py.typed"]

[tool.setuptools.packages.find]
include = ["register*"]

[tool.pytest.ini_options]
addopts = "-s"
minversion = "6.0"
testpaths = ["tests"]

[tool.mypy]
allow_any_generics = false
allow_untyped_defs = false
check_untyped_defs = true
extra_checks = true
ignore_missing_imports = true
no_implicit_optional = true
python_version = "3.14"
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true

[tool.ruff]
indent-width = 4
line-length = 88
preview = true
target-version = "py314"

[tool.ruff.lint]
ignore = ["B028", "B905", "C408", "E203", "SIM102", "SIM108"]
preview = true
select = ["B", "C4", "E", "F", "FURB", "I", "PT", "Q", "SIM", "U", "YTT"]
